name: PNC Bootcamp Capstone CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file ./server/pom.xml
    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: server/target/*-reports

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
         node-version: 22
         cache-dependency-path: ./client/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
  
  java-sca:
    runs-on: ubuntu-latest
    needs: [java-server]
    defaults:
      run:
        working-directory: ./server
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up .NET 8.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    - name: Cache NVD data feed
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-${{ github.run_id }}
        restore-keys: nvd-
    - run: mvn -B -Psecurity-scan dependency-check:check
    - name: Upload dependency-check reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: server/target/dependency-check-report.*

  SAST:
    runs-on: ubuntu-latest
    needs: [java-server, node]
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4

