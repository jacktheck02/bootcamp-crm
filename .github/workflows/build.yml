name: PNC Bootcamp Capstone CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file ./server/pom.xml
    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: server/target/*-reports

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
         node-version: 22
         cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test -- --run
      - run: npm run build
  
  java-sca:
    runs-on: ubuntu-latest
    needs: [java-server]
    defaults:
      run:
        working-directory: ./server
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up .NET 8.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    - name: Cache NVD data feed
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-${{ github.run_id }}
        restore-keys: nvd-
    - run: mvn -B -Psecurity-scan dependency-check:check
    - name: Upload dependency-check reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: server/target/dependency-check-report.*

  SAST:
    runs-on: ubuntu-latest
    needs: [java-server, node]
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  deploy:
    name: Build, push, and deploy to OpenShift
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [java-server, node]
    runs-on: ubuntu-latest
    env:
      REGISTRY: quay.io/jacktheck02
    steps:
      - uses: actions/checkout@v7

      - name: Log in to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/pnc-bootcamp-crm-server:${{ github.sha }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/pnc-bootcamp-crm-client:${{ github.sha }}

      - name: Build and push kafka image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/images/kafka
          push: true
          tags: ${{ env.REGISTRY }}/pnc-bootcamp-crm-kafka:${{ github.sha }}

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Deploy to OpenShift
        run: |
          oc login --server="${{ secrets.OCP_SERVER }}" --token="${{ secrets.OCP_TOKEN }}"
          oc project "${{ secrets.OCP_NAMESPACE }}"
          oc create secret generic crm-secrets \
            --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | oc apply -f -
          echo "Previous backend image: $(oc get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          oc apply -f deploy/openshift/
          oc set image deployment/backend  backend=${{ env.REGISTRY }}/pnc-bootcamp-crm-server:${{ github.sha }}
          oc set image deployment/frontend frontend=${{ env.REGISTRY }}/pnc-bootcamp-crm-client:${{ github.sha }}
          oc set image deployment/kafka    kafka=${{ env.REGISTRY }}/pnc-bootcamp-crm-kafka:${{ github.sha }}
          oc rollout status deployment/postgres --timeout=180s
          oc rollout status deployment/kafka    --timeout=180s
          oc rollout status deployment/backend  --timeout=480s
          oc rollout status deployment/frontend --timeout=180s

      - name: Smoke test
        run: |
          # 1) Backend health (Service is internal -> port-forward from the runner)
          oc port-forward svc/backend 18080:8080 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 3
          BODY=$(curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://localhost:18080/actuator/health)
          echo "Backend /actuator/health: $BODY"
          echo "$BODY" | grep -q '"status":"UP"' || { echo "Backend not UP"; exit 1; }

          # 2) Frontend Route serving the SPA (any unmatched path 200s with index.html,
          #    so assert on the real app marker, not just the status code)
          HOST=$(oc get route frontend -o jsonpath='{.spec.host}')
          HTML=$(curl -fsS "https://$HOST/")
          echo "$HTML" | grep -q 'id="root"' || { echo "Frontend not serving the SPA"; exit 1; }
          echo "OK: backend UP, frontend serving at https://$HOST"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy of ${GITHUB_SHA::7} failed — rolled back to previous images" >> "$GITHUB_STEP_SUMMARY"
          if ! oc login --server="${{ secrets.OCP_SERVER }}" --token="${{ secrets.OCP_TOKEN }}"; then
            echo "Could not log in to OpenShift (expired token?). Manual rollback required — see RUNBOOK.md."
            exit 1
          fi
          oc project "${{ secrets.OCP_NAMESPACE }}"
          oc rollout undo deployment/frontend
          oc rollout undo deployment/backend
          oc rollout undo deployment/kafka
          oc rollout status deployment/backend  --timeout=240s
          oc rollout status deployment/frontend --timeout=180s
          oc rollout status deployment/kafka    --timeout=180s
          echo "Rollback complete. Cluster is back on the previous release."
          exit 1   # rollback succeeded, but the deploy FAILED — keep the job red

      - name: Deploy summary
        if: success()
        run: |
          echo "Deployed ${GITHUB_SHA::7} to OpenShift sandbox" >> "$GITHUB_STEP_SUMMARY"
          echo "Route: https://$(oc get route frontend -o jsonpath='{.spec.host}')" >> "$GITHUB_STEP_SUMMARY"

