apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: quay.io/jacktheck02/pnc-bootcamp-crm-server:v0.1.3
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/crm
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: crm-secrets, key: POSTGRES_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: crm-secrets, key: POSTGRES_PASSWORD }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: PNC_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: crm-secrets, key: JWT_SECRET }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend   # name matters: nginx proxies to http://backend:8080
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
