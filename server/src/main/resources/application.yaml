spring:
  kafka:
    consumer:
      group-id: test-group
  application:
    name: crm
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: crm
    password: secret
pnc:
  security:
    jwt-secret: test-secret
crm:
  kafka:
    customer-events-topic: customer-events
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
